<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PonyDrone · in pausa</title>
<meta http-equiv="refresh" content="0; url=/">
<script>
  // il vecchio service worker di /drone/ viene sostituito da sw.js, che si disinstalla da solo
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => { if (r.scope.endsWith('/drone/')) r.update(); }));
  location.replace('/');
</script>
</head>
<body style="background:#23211e;color:#ece4cf;font-family:sans-serif;padding:24px">
<p>PonyDrone è in pausa. <a href="/" style="color:#ffb347">Vai a PONY84</a>.</p>
</body>
</html>
